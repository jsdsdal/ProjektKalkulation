<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <link rel="stylesheet" th:href="@{/main.css}"/>
</head>
<body>

<!-- NAV -->
<aside th:replace="~{fragments :: sidebar(activePage='projects')}"></aside>

<div class="form-page">


  <div class="form-wrapper">
    <h1 th:text="${formTitle}">Create Project</h1>

    <div class="error-banner" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="${formAction}" th:object="${project}" method="post">
      <div class="field">
        <label for="title">Title</label>
        <input id="title" type="text" th:field="*{title}" maxlength="50" placeholder="Indtast venligst"/>
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" class="description-field" th:field="*{description}" maxlength="500" placeholder="Skriv venligst"></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="startDate">Start Date</label>
          <input id="startDate" type="date" th:field="*{startDate}"/>
        </div>

        <div class="field">
          <label for="endDate">End Date</label>
          <input id="endDate" type="date" th:field="*{endDate}"/>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="hour_price">Hour Price</label>
          <input id="hour_price" type="number" th:field="*{hourPrice}" placeholder="Indtast venligst" min="150"/>
        </div>

        <div class="field">
          <label for="status">Status</label>
          <select id="status" th:field="*{status}">
            <option th:each="s : ${statusList}" th:value="${s}" th:text="${s}"></option>
          </select>
        </div>

        <div class="field">
          <label for="projectOwnerId">Project Owner</label>
          <select id="projectOwnerId" name="projectOwnerId">
            <option value="" disabled selected>Vælg Project Owner</option>
            <option th:each="e : ${employees}"
                    th:value="${e.getEmployeeId}"
                    th:text="${e.getName}"
                    th:selected="${project.projectOwner != null and project.projectOwner.employeeId == e.employeeId}">
            </option>
          </select>
        </div>

        <div>
          <input type="hidden" th:field="*{parentProjectId}"/>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" th:text="${submitLabel}">Create</button>
        <a th:href="${cancelUrl}" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>

</div>

</body>
</html>
