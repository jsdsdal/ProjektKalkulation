<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task</title>


</head>
<body>
<div class="form-page">


  <div class="form-wrapper">
    <h1 th:text="${formTitle}">Create Task</h1>

    <div class="error-banner" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="${formAction}" th:object="${task}" method="post">
      <input type="hidden" name="projectId" th:value="${projectId}" th:if="${projectId != null}"/>
      <div class="field">
        <label for="title">Title</label>
        <input id="title" type="text" th:field="*{title}" maxlength="50" placeholder="Title"/>
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" th:field="*{description}" maxlength="500" placeholder="Type your description here…"></textarea>
      </div>

      <div class="field">
        <label>Competencies</label>
        <div th:each="c : ${allCompetencies}">
          <input type="checkbox"
                 name="competenceId"
                 th:value="${c.id}"
                 th:id="${'competence-' + c.id}"
                 th:checked="${task.competencies != null and task.competencies.contains(c.title)}"/>
          <label th:for="${'competence-' + c.id}" th:text="${c.title}"></label>
        </div>
      </div>

      <div class="field">
        <label>Assignees</label>
        <div th:each="e : ${allEmployees}">
          <label>
            <input type="checkbox"
                   name="employeeId"
                   th:value="${e.employeeId}"
                   th:id="${'employee-' + e.employeeId}"
                    th:checked="${task.assignees != null and task.assignees.?[employeeId == #root.e.employeeId].size() > 0}"/>
          </label>
          <label th:for="${'employee-' + e.employeeId}" th:text="${e.name}"></label>
        </div>
      </div>

      <div class="field">
        <label for="startDate">Start Date</label>
        <input id="startDate" type="date" th:field="*{startDate}"/>
      </div>

      <div class="field">
        <label for="endDate">End Date</label>
        <input id="endDate" type="date" th:field="*{endDate}"/>
      </div>

      <div class="field">
        <label for="estimatedHours">Estimated Hours</label>
        <input id="estimatedHours" type="number" th:field="*{estimatedHours}" placeholder="e.g. 10.00" min="0" step="0.50"/>
      </div>

      <div class="field" th:if="${task.taskId != null}">
        <label for="actualHours">Actual Hours</label>
        <input id="actualHours" type="number" th:field="*{actualHours}" placeholder="e.g. 10.00" min="0" step="0.50"/>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" th:text="${submitLabel}">Create Task</button>
        <a th:href="${cancelUrl}" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>

</div>

</body>
</html>
