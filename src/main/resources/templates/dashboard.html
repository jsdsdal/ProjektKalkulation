<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/main.css}"/>
</head>

<body>
<aside th:replace="~{fragments :: sidebar(activePage='dashboard')}"></aside>

<main class="main">

    <div class="page-header">
        <h1 class="page-title">Dashboard</h1>
    </div>

    <div class="page-subheader">
        <h2 class="page-subtitle">Activity this financial quarter</h2>
    </div>

    <!-- Stat cards -->
    <div class="stat-cards">
        <div class="stat-card">
            <div class="stat-card-label">Resource load this month</div>
            <div class="stat-card-value">0</div>
            <div class="stat-card-sub">across all projects</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-label">Forecasted revenue</div>
            <div class="stat-card-value">0</div>
            <div class="stat-card-sub">across all projects</div>
        </div>
        <div class="stat-card warning">
            <div class="stat-card-label">Actual revenue</div>
            <div class="stat-card-value">0</div>
            <div class="stat-card-sub">0 deviation</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-label">Yearly revenue</div>
            <div class="stat-card-value">0</div>
            <div class="stat-card-sub">Across this years projects</div>
        </div>
    </div>


    <div class="dashboard-bottom">

        <div class="stat-card-table">
            <h3 class="stat-card-table-title">Projects requiring attention</h3>
        </div>

        <div class="stat-card-table">
            <h3 class="stat-card-table-title">Resource load per employee</h3>
            <div class="stat-card-table-row" th:each="row : ${resourceLoad}">
                <span class="td-title" th:text="${#strings.arraySplit(row, '|')[0]}"></span>
                <span class="td-mono" th:text="${#strings.arraySplit(row, '|')[1] + '%'}"></span>
            </div>
        </div>

    </div>

</main>
</body>
</html>
