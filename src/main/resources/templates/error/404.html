<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|${status} - ${error}|">404 - Not Found</title>
    <link rel="stylesheet" th:href="@{/main.css}"/>
</head>
<body>

<div class="error-page">
    <div class="error-icon">
        <img src="/icon/404.svg" width="100" height="100"/>
    </div>

    <h1 class="error-code" th:text="${status}">404</h1>
    <h2 class="error-title" th:text="${error}">Not Found</h2>

    <p class="error-message" th:text="${message}">Site was not found.</p>

    <a th:href="@{/dashboard}" class="btn-primary">Go back to the dashboard</a>
</div>

</body>
</html>
