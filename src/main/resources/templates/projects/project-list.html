<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Projects — AlphaScope</title>
    <link rel="stylesheet" th:href="@{/main.css}"/>
</head>
<body>
<!-- NAV -->
<aside th:replace="~{fragments :: sidebar(activePage='projects')}"></aside>

<!-- CONTENT -->
<main class="main">

    <div class="page-header">
        <h1 class="page-title">Projects</h1>
        <a th:href="@{/projects/create-project}" class="btn-primary">+ NEW PROJECT</a>
    </div>
    <!-- tabs - navigationspanel -->
    <div class="tabs-row">
        <div class="tabs">
            <button class="tab active">Overview</button>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Search projects..."/>
        </div>
    </div>
    <!-- stats - fabrikeret / opsat -->
    <div class="stat-cards">
        <div class="stat-card">
            <div class="stat-card-label">Active projects</div>
            <div class="stat-card-value" th:text="${activeProjects}">0</div>
            <div class="stat-card-sub">counting all projects</div>
        </div>
        <div class="stat-card"
             th:classappend="${tasksDueThisWeekCount > 0} ? ' warning' : ' success'">
            <div class="stat-card-label">Tasks due this week</div>
            <div class="stat-card-value" th:text="${tasksDueThisWeekCount}">—</div>
            <div class="stat-card-sub"
                 th:text="${tasksDueThisWeekCount == 0} ? 'Nothing due this week'
                         : ${tasksDueThisWeekCount} + ' tasks need attention'">
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-label">Est. hours this week</div>
            <div class="stat-card-value"
                 th:text="${estimatedHoursThisWeek != null} ? ${#numbers.formatDecimal(estimatedHoursThisWeek, 1, 0)} + ' h' : '—'">—</div>
            <div class="stat-card-sub">across all active tasks</div>
        </div>
        <div class="stat-card"
             th:classappend="${needsAttention > 0} ? ' danger' : ' success'">
            <div class="stat-card-label">Projects needing attention</div>
            <div class="stat-card-value" th:text="${needsAttention}">—</div>
            <div class="stat-card-sub"
                 th:text="${needsAttention == 0} ? 'All projects on track'
                         : ${needsAttention} + ' projects at risk'">
            </div>
        </div>
    </div>
    <!-- også fabrikeret sort -->
    <div class="section-header">
        <span class="section-title">Table view</span>
        <button class="sort-btn">Sort by... ▾</button>
    </div>

    <!-- tabel -->
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Title </th>
                <th>Est. revenue</th>
                <th>Actual revenue</th>
                <th>Est. hours</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>

            <th:block th:each="project : ${projects}">
                <tr>
                    <td class="td-title">
                        <a th:href="@{/projects/{id}(id=${project.projectId})}"
                           th:text="${project.title}">Title</a>
                    </td>
                    <td th:with="est=${project.hourPrice != null} ? ${project.hourPrice.multiply(T(java.math.BigDecimal).valueOf(estimatedHoursByProject.get(project.projectId) != null ? estimatedHoursByProject.get(project.projectId) : 0))} : null"
                        th:text="${est != null} ? ${#numbers.formatDecimal(est, 1, 'POINT', 0, 'NONE')} + ' DKK' : '—'">—</td>
                    <td th:with="act=${project.hourPrice != null} ? ${project.hourPrice.multiply(T(java.math.BigDecimal).valueOf(actualHoursByProject.get(project.projectId) != null ? actualHoursByProject.get(project.projectId) : 0))} : null"
                        th:text="${act != null} ? ${#numbers.formatDecimal(act, 1, 'POINT', 0, 'NONE')} + ' DKK' : '—'">—</td>
                    <td th:text="${estimatedHoursByProject.get(project.projectId) != null} ? ${estimatedHoursByProject.get(project.projectId)} + ' h' : '—'">—</td>                    <td>
                        <!-- status + farver -->
                        <span class="badge"
                              th:classappend="${project.status == 'Actual Hours Done'} ? ' badge-green'
                                           : (${project.status == 'Estimate in Progress'} ? ' badge-yellow'
                                           : (${project.status == 'Rejected'} ? ' badge-red'
                                           : (${project.status == 'Not Started'} ? ' badge-gray'
                                           : ' badge-blue')))"
                              th:text="${project.status}">Status</span>
                    </td>
                    <td>
                        <!-- slet og rediger -->
                        <a th:href="@{${editProjectUrl}(id=${project.projectId})}"
                           style="font-size:12px; color:var(--gray-500); margin-right:8px;">Edit</a>
                        <form th:action="@{${deleteProjectUrl}(id=${project.projectId})}"
                              method="post" style="display:inline;"
                              onsubmit="return confirm('Are you sure you want to delete this project?')">
                            <button type="submit" class="action-menu-btn">✕</button>
                        </form>
                    </td>
                </tr>
            </th:block>

            <tr th:if="${#lists.isEmpty(projects)}">
                <td colspan="8" style="text-align:center; color:var(--gray-500); padding:40px;">
                    Ingen projekter fundet.
                </td>
            </tr>

            </tbody>
        </table>
    </div>
    <!-- knapper til flere sider - virker ikke, fabrikeret -->
    <div class="pagination">
        <button class="page-btn-arrow" disabled>&#8249;</button>
        <button class="page-btn active">1</button>
        <button class="page-btn-arrow">&#8250;</button>
    </div>

</main>

</body>
</html>
