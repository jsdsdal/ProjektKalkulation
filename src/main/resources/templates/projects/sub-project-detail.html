<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Project</title>
</head>
<body>

<h1 th:text="${project.title}">View Project</h1>


<h3>Description</h3>
<div th:text="${project.description}"></div>

<div>
    <a Create Task th:href="@{${createTaskUrl}}">Create Task</a>
</div>


<div>
  <p>Start Date: <span th:text="${project.startDate}"></span> </p>
</div>

<div>
  <p>End Date: <span th:text="${project.endDate}"></span></p>
</div>

<div>
  <p>Project Owner: <span th:text="${project.projectOwner}"></span></p>
</div>

<div>
  <p>Hour Price: <span th:text="${project.hourPrice}"></span></p>
</div>

<div>
  <p>Status: <span th:text="${project.status}"></span></p>
</div>

<div>

</div>

<div>
    <a Close th:href="@{${closeUrl}}">Close</a>
</div>





</body>
</html>
