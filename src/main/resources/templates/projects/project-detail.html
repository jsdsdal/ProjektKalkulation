<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${project.title}">Project Detail</title>
</head>
<body>

<div>
    <a Create Sub Project th:href="@{${createSubProjectUrl}}">Create Sub Project</a>
</div>

<div>
    <a Create Task th:href="@{${createTaskUrl}}">Create Task</a>
</div>

    <table>
        <thead>
        <tr>
            <th>Title</th>
            <th>Type</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Est. Hours</th>
            <th>Actual Hours</th>
        </tr>
        </thead>
        <tbody>
        <!-- Subprojects -->
        <th:block th:each="sub : ${project.subProjects}">
            <tr>

                <td>

                    <button th:attr="popovertarget='subproject-' + ${sub.projectId}" th:text="${sub.title}">View Sub Project</button>

                    <div th:replace="~{fragments :: subProjectModal(${sub})}"></div>

<!--                        <a th:href="@{${readSubProjectAndTaskBaseUrl} + ${sub.projectId}}"-->
<!--                           th:text="${sub.title}">Subproject</a>-->
                </td>
                <td>Subproject</td>
                <td th:text="${sub.startDate}"></td>
                <td th:text="${sub.endDate}"></td>
                <td></td>
            </tr>
            <th:block th:replace="~{:: taskRows(${sub.tasks}, 1)}" />
        </th:block>

        <!-- Tasks direkte på projektet -->
        <th:block th:replace="~{:: taskRows(${project.tasks}, 0)}" />
        </tbody>
    </table>

    <!-- Rekursivt fragment -->
    <th:block th:fragment="taskRows(tasks, depth)">
        <th:block th:each="task : ${tasks}">
            <tr>
                <td th:style="'padding-left: ' + (${depth} * 30) + 'px'">


                    <button th:attr="popovertarget='task-' + ${task.taskId}" th:text="${task.title}">View Task</button>

                    <div th:replace="~{fragments :: taskModal(${task})}"></div>

                </td>
                <td th:text="${depth} == 0 ? 'Task' : 'Task'">Type</td>
                <td th:text="${task.startDate}"></td>
                <td th:text="${task.endDate}"></td>
                <td th:text="${task.estimatedHours}"></td>
                <td th:text="${task.actualHours}"></td>
            </tr>
            <th:block th:if="${task.subTask != null and !task.subTask.isEmpty()}"
                      th:replace="~{:: taskRows(${task.subTask}, ${depth} + 1)}" />
        </th:block>
    </th:block>


</body>
</html>
