<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8">
    <title>task test</title>
    <link rel="stylesheet" th:href="@{/main.css}"/>
</head>
<body>
<button th:attr="popovertarget='task-' + ${task.taskId}">Click me</button>

<div th:replace="~{fragments :: taskModal(${task})}"></div>

<h1 th:text="${task.title}">View Task</h1>


<h3>Description</h3>
<div th:text="${task.description}"></div>



<div>
    <p>Start Date: <span th:text="${task.startDate}"></span> </p>
</div>

<div>
    <p>End Date: <span th:text="${task.endDate}"></span></p>
</div>

<div>
    <p>Estimated Hours: <span th:text="${task.estimatedHours}"></span></p>
</div>

<div>
    <p>Actual Hours: <span th:text="${task.actualHours}"></span></p>
</div>

<div>
    <p>Assignees: <span th:text="${task.assignees}"></span></p>
</div>

<div>
    <p>Competencies: <span th:text="${task.competencies}"></span></p>
</div>



</body>
</html>
